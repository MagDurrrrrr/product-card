<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <script src="./scripts/script.js" defer></script>
    <script src="./scripts/homework-7.js" defer></script>
    <script src="./scripts/homework-8.js" defer></script>
    <script type="module" src="./scripts/homework-9.js"></script>
    <script type="module" src="./scripts/homework-10.js"></script>
</body>
  </head>
  <body>
    <main class="page">
      <section class="products">
        <div class="products__controls">
          <button
            class="products__button"
            id="change-first-card-color-button"
            type="button"
          >
            Изменить цвет первой карточки
          </button>
          <button
            class="products__button"
            id="change-all-card-color-button"
            type="button"
          >
            Изменить цвет всех карточек
          </button>
          <button
            class="products__button"
            id="open-google-button"
            type="button"
          >
            Открыть Google
          </button>
          <button
            class="products__button"
            id="output-message-button"
            type="button"
          >
            Вывести сообщение
          </button>
          <button class="products__button toggle-button" type="button">
            Переключить цвет
          </button>
        </div>
        <h1 class="products__title">Выбери свой продукт</h1>
        <div class="products__list"></div>
      </section>
    </main>
  </body>
</html>
